name: Deploy

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "app = ECS services only; full = everything except ecr and github-oidc"
        type: choice
        options: [app, full]
        default: app
      image_tag:
        description: "Commit SHA to deploy (blank = HEAD of the branch you run from)"
        required: false
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  CLUSTER: ecs-rds-deployment
  TF_VAR_image_tag: ${{ inputs.image_tag || github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.scope == 'full' && 'dev-full' || 'dev-app' }}
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_limit_amount: ${{ vars.BUDGET_LIMIT }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate tag
        run: |
          if [[ ! "$TF_VAR_image_tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_tag must be a full 40 character commit SHA, got: $TF_VAR_image_tag" >&2
            exit 1
          fi
      
      - name: Check both images exist in ECR
        run: |
          for repo in ecs-rds-deployment-backend ecs-rds-deployment-frontend; do
            if ! aws ecr describe-images \
                --repository-name "$repo" \
                --image-ids imageTag="$TF_VAR_image_tag" >/dev/null; then
              echo "ECR repo $repo has no image tagged $TF_VAR_image_tag" >&2
              exit 1
            fi
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Apply
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          if [[ "$SCOPE" == "app" ]]; then
            export ONLY="ecs-backend ecs-frontend"
          fi
          ./terraform/apply-resources.sh "$TF_VAR_image_tag"
      
      - name: Wait for services to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services ecs-rds-deployment-backend ecs-rds-deployment-frontend

      - name: Confirm the new image is actually the one running
        run: |
          for svc in ecs-rds-deployment-backend ecs-rds-deployment-frontend; do
            td="$(aws ecs describe-services --cluster "$CLUSTER" --services "$svc" \
              --query "services[0].deployments[?status=='PRIMARY'].taskDefinition | [0]" --output text)"
            img="$(aws ecs describe-task-definition --task-definition "$td" \
              --query 'taskDefinition.containerDefinitions[0].image' --output text)"
            if [[ "$img" != *":$TF_VAR_image_tag" ]]; then
              echo "$svc is running $img, expected tag $TF_VAR_image_tag" >&2
              exit 1
            fi
          done

      - name: Smoke test through the load balancer
        run: |
          terraform -chdir=terraform/dev/alb init -input=false
          lb="$(terraform -chdir=terraform/dev/alb output -raw lb_dns_name)"
          ./terraform/smoke-test.sh "http://$lb"
